services:
  - type: web
    name: dukaankhata
    runtime: node
    plan: free # Change to starter if attaching persistent disk
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: ADMIN_SECRET
        generateValue: true
    # Persistent Disk (Optional for paid Starter tier, recommended for persistent SQLite in production):
    # disk:
    #   name: dukaankhata-data
    #   mountPath: /var/data
    #   sizeGB: 1
